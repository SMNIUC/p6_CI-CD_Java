services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: workshop-organizer
    ports:
      - "8080:8080"
    environment:
      # DB connection — points at the "db" service on the compose network,
      # overriding the localhost values from application.properties.
      # Credentials are read from the .env file (same vars as the db service).
      SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        # Don't start the app until Postgres reports healthy.
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Give Spring Boot time to boot before health checks start counting.
      start_period: 60s
    restart: unless-stopped

  db:
    image: postgres:13
    environment:
      # Credentials are read from the .env file (see .env.example).
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume so data survives container restarts / recreation.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data: