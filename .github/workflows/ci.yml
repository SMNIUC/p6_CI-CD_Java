name: CI

# Generic CI workflow — currently covers the TEST phase only.
# It is designed to be dropped into either a Node/npm project (like this one)
# or a Java/Gradle project without modification: the project type is detected
# automatically (or forced via the PROJECT_TYPE variable below), and the right
# toolchain, dependency cache and test command are selected with conditionals.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token. `checks: write` lets the test reporter publish results
# back into the Actions UI; everything else stays read-only.
permissions:
  contents: read
  checks: write

# ---------------------------------------------------------------------------
# Tweak these to adapt the workflow to a given project without touching steps.
# PROJECT_TYPE: 'auto' (detect from files), or force 'node' / 'java'.
# ---------------------------------------------------------------------------
env:
  PROJECT_TYPE: auto
  NODE_VERSION: '24'
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: temurin

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Safety net: abort instead of spinning for the default 6 hours if a test
    # runner (e.g. headless Chrome) hangs and stops responding.
    timeout-minutes: 15

    # Expose the detected project type so the build job can adapt validation to it.
    outputs:
      project_type: ${{ steps.detect.outputs.type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # --- Resolve which kind of project this is --------------------------
      - name: Detect project type
        id: detect
        run: |
          type="${PROJECT_TYPE}"
          if [ "$type" = "auto" ]; then
            if [ -f package.json ]; then
              type=node
            elif [ -f build.gradle ] || [ -f build.gradle.kts ] || [ -f gradlew ]; then
              type=java
            else
              echo "::error::Could not detect project type. Set the PROJECT_TYPE variable to 'node' or 'java'."
              exit 1
            fi
          fi

          # JUnit report location differs per ecosystem; expose it for the reporter/artifact steps.
          case "$type" in
            node) report_path='**/reports/*.xml,**/test-results/**/*.xml' ;;
            java) report_path='**/build/test-results/test/*.xml' ;;
            *) echo "::error::Unsupported PROJECT_TYPE '$type'."; exit 1 ;;
          esac

          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
          echo "Detected project type: $type"

      # --- Node / npm -----------------------------------------------------
      - name: Set up Node.js
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm # caches the npm download cache keyed on package-lock.json

      - name: Install dependencies (npm)
        if: steps.detect.outputs.type == 'node'
        # Secrets are referenced only through env and never echoed; GitHub also
        # auto-masks registered secrets in logs. The token is optional — the step
        # works for public deps when NODE_AUTH_TOKEN is empty.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci

      - name: Run tests (npm)
        if: steps.detect.outputs.type == 'node'
        run: npm test

      # --- Java / Gradle --------------------------------------------------
      - name: Set up JDK
        if: steps.detect.outputs.type == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle # caches ~/.gradle keyed on the Gradle build files

      - name: Run tests (Gradle)
        if: steps.detect.outputs.type == 'java'
        env:
          GRADLE_TOKEN: ${{ secrets.GRADLE_TOKEN }}
        run: ./gradlew test --no-daemon

      # --- Test report + artifacts (both ecosystems) ----------------------
      # Publishes the JUnit results as a check run visible in the Actions UI / PR.
      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always() # report even when tests fail, so results are still visible
        with:
          name: Test results
          path: ${{ steps.detect.outputs.report_path }}
          reporter: java-junit # parses standard JUnit XML (npm & Gradle both emit it)
          fail-on-error: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            reports/
            test-results/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build the Docker image, validate it runs, then push it to the GitHub
  # Container Registry (GHCR) tagged as `<branch>-<short-sha>`.
  # Runs only after tests pass, and only on branch pushes (not pull requests).
  # ---------------------------------------------------------------------------
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    timeout-minutes: 20

    # Least-privilege: read the repo, write packages (push to GHCR).
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      # Image repository — defaults to this repo (owner/name). Override to retarget.
      IMAGE_NAME: ${{ github.repository }}
      # --- Generic validation knobs (per-language specifics are resolved below) ---
      # Mode: 'http'    -> probe an HTTP endpoint for EXPECTED_STATUS
      #       'running' -> just check the container stays up (good for non-HTTP apps/services)
      #       'none'    -> skip validation entirely
      VALIDATE: http
      EXPECTED_STATUS: '200'        # expected HTTP status code
      TEST_PORT: '8080'             # host port mapped to the app's port during validation
      STARTUP_TIMEOUT: '120'        # seconds to wait for the app to become healthy
      DB_IMAGE: postgres:16-alpine  # ephemeral DB started only for DB-backed (java) images

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image reference and tag
        id: meta
        run: |
          # GHCR requires a lowercase repository path.
          image="$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          # Sanitize the branch name: slashes and other chars are illegal in tags.
          branch="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]._-')"
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          ref="${image}:${branch}-${short_sha}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Image will be tagged: $ref"

      # Build the image into the local daemon first (no push yet) so it can be
      # validated before it ever reaches the registry.
      - name: Build image (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pick the validation settings that match the project type the test job detected,
      # so this one file works for both the Angular and the Java image.
      - name: Resolve validation settings
        if: env.VALIDATE != 'none'
        run: |
          set -euo pipefail
          type="${{ needs.test.outputs.project_type }}"
          echo "Project type: $type"
          case "$type" in
            node)
              # Angular served by nginx: HTTP on port 80, no backing services.
              echo "CONTAINER_PORT=80" >> "$GITHUB_ENV"
              echo "HEALTH_PATH=/" >> "$GITHUB_ENV"
              echo "NEEDS_DB=false" >> "$GITHUB_ENV"
              ;;
            java)
              # Spring Boot: HTTP on 8080, actuator health, needs a PostgreSQL at startup.
              echo "CONTAINER_PORT=8080" >> "$GITHUB_ENV"
              echo "HEALTH_PATH=/actuator/health" >> "$GITHUB_ENV"
              echo "NEEDS_DB=true" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Cannot resolve validation settings for project type '$type'."
              exit 1
              ;;
          esac

      - name: Validate image is functional
        if: env.VALIDATE != 'none'
        run: |
          set -euo pipefail

          network=ci-validate-net
          cleanup() {
            docker logs ci-validate 2>&1 || true
            docker rm -f ci-validate ci-postgres >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Isolated network so the app container can reach the DB by name (when needed).
          docker network create "$network" >/dev/null

          app_env=()
          if [ "${NEEDS_DB}" = "true" ]; then
            echo "Starting ephemeral PostgreSQL for validation..."
            docker run -d --name ci-postgres --network "$network" \
              -e POSTGRES_USER=app -e POSTGRES_PASSWORD=app -e POSTGRES_DB=app \
              "${DB_IMAGE}" >/dev/null
            for i in $(seq 1 30); do
              if docker exec ci-postgres pg_isready -U app >/dev/null 2>&1; then
                echo "PostgreSQL is ready."
                break
              fi
              sleep 2
            done
            # Throwaway CI credentials; the app reaches the DB by container name on the shared network.
            app_env+=(-e "SPRING_DATASOURCE_URL=jdbc:postgresql://ci-postgres:5432/app")
            app_env+=(-e "SPRING_DATASOURCE_USERNAME=app")
            app_env+=(-e "SPRING_DATASOURCE_PASSWORD=app")
          fi

          docker run -d --name ci-validate --network "$network" \
            -p "${TEST_PORT}:${CONTAINER_PORT}" "${app_env[@]}" \
            "${{ steps.meta.outputs.ref }}"
          base_url="http://localhost:${TEST_PORT}"

          case "$VALIDATE" in
            http)
              ok=0
              deadline=$(( SECONDS + STARTUP_TIMEOUT ))
              while [ "$SECONDS" -lt "$deadline" ]; do
                # Fail fast on a boot crash instead of waiting out the whole timeout.
                if [ "$(docker inspect -f '{{.State.Running}}' ci-validate 2>/dev/null)" != "true" ]; then
                  echo "::error::Container exited before becoming healthy (boot failure)."
                  break
                fi
                code="$(curl -s -o /dev/null -w '%{http_code}' "${base_url}${HEALTH_PATH}" || true)"
                if [ "$code" = "$EXPECTED_STATUS" ]; then
                  echo "App responded with HTTP $code (expected $EXPECTED_STATUS)."
                  ok=1
                  break
                fi
                echo "Waiting for app... got '$code', want '$EXPECTED_STATUS' (${SECONDS}s/${STARTUP_TIMEOUT}s)"
                sleep 3
              done
              ;;
            running)
              # Non-HTTP app/service: succeed if the container is still up after a grace period.
              ok=0
              sleep 5
              if [ "$(docker inspect -f '{{.State.Running}}' ci-validate 2>/dev/null)" = "true" ]; then
                echo "Container is up and running."
                ok=1
              fi
              ;;
            *)
              echo "::error::Unknown VALIDATE mode '$VALIDATE' (expected http|running|none)."
              exit 1
              ;;
          esac

          if [ "$ok" != "1" ]; then
            echo "::error::Image failed validation — not pushing."
            exit 1
          fi

      # Only reached if validation passed. The image is already in the local
      # daemon, so we just push it (login uses the auto-provided GITHUB_TOKEN,
      # which GitHub masks in logs).
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push "${{ steps.meta.outputs.ref }}"